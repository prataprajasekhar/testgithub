# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Datasource Configuration
spring.datasource.url=jdbc:h2:mem:timesheetdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.defer-datasource-initialization=true

# JWT Configuration
jwt.secret=your-very-secure-secret-key-for-jwt-hs256
jwt.expiration=86400000 # 24 hours in milliseconds

# Springdoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.writer.default-produces-media-type=application/json

# Basic API Info
springdoc.api-docs.info.title=Timesheet Application API
springdoc.api-docs.info.version=v1.0.0
springdoc.api-docs.info.description=REST APIs for managing timesheets, users, and roles.
